[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custodian"
version = "0.1.0"
description = "An AI maintainer agent for open-source repositories, built on Meta's Muse models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
modal = ["modal>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
custodian = "custodian.cli:main"

[tool.setuptools]
packages = ["custodian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
